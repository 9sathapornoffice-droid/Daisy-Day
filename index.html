<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 Daisy Day - Handmade Flowers | แคตตาล็อกดอกไม้ลวดกำมะหยี่</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
  
  <!-- Google Fonts: Kanit, Mali, Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Kanit:wght@300;400;500;600;700&family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- Floating Flower Petals Background -->
  <div class="petal-canvas" id="petalCanvas"></div>

  <!-- App Wrapper (Mobile Mockup Frame) -->
  <div class="app-container">
    
    <!-- Top Header with Daisy Day Shop Logo & Name -->
    <header class="app-header">
      <div class="brand-wrapper" onclick="goToPage(0)">
        <img id="brandLogoImg" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" alt="Daisy Day Logo" class="brand-logo-img">
        <div class="brand-info">
          <h1>Daisy Day</h1>
          <p>Handmade Flowers • Bloom Happiness ♡</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="action-btn" id="toggleSoundBtn" title="เปิด/ปิดเสียงเอฟเฟกต์พลิกหน้า">🔊</button>
        <button class="action-btn" id="toggleDesktopBtn" title="สลับมุมมองหน้าจอ">💻</button>
      </div>
    </header>

    <!-- Category Filter Bar (ทั้งหมด, ดอกเดี่ยว, รวมช่อ, ทานตะวัน) -->
    <nav class="category-nav-bar">
      <div class="category-scroll">
        <button class="category-pill active" data-category="all">
          <span>✨</span>
          <span>ทั้งหมด</span>
        </button>
        <button class="category-pill" data-category="single">
          <span>🌷</span>
          <span>ดอกเดี่ยว</span>
        </button>
        <button class="category-pill" data-category="bouquet">
          <span>💐</span>
          <span>รวมช่อ</span>
        </button>
        <button class="category-pill" data-category="sunflower">
          <span>🌻</span>
          <span>ทานตะวัน</span>
        </button>
      </div>
    </nav>

    <!-- View Mode Switcher -->
    <div class="view-mode-bar">
      <div class="view-mode-toggles">
        <button class="view-toggle-btn active" data-view="flipbook">
          <span>📖</span>
          <span>ฟลิปบุ๊ก (Flipbook)</span>
        </button>
        <button class="view-toggle-btn" data-view="grid">
          <span>📱</span>
          <span>ตารางสินค้า (Grid)</span>
        </button>
      </div>
      <div class="helper-tip">
        <span>✨</span>
        <span>ปัดหน้าจอเพื่อพลิกชม</span>
      </div>
    </div>

    <!-- 1. FLIPBOOK CATALOG SECTION -->
    <section class="flipbook-section" id="flipbookSection">
      <!-- 3D Book Container -->
      <div class="book-wrapper">
        <div class="book-spine-shadow"></div>
        
        <!-- Pages Container -->
        <div class="book-pages" id="bookPagesContainer">
          <!-- Dynamically generated by app.js -->
        </div>

        <!-- Corner Peel Cue -->
        <div class="corner-curl-cue" id="cornerCurlCue" title="แตะเพื่อพลิกหน้า">
          <span>👉</span>
        </div>
      </div>

      <!-- Flip Controls -->
      <div class="flip-controls">
        <button class="flip-btn" id="prevPageBtn" title="หน้าก่อนหน้า">‹</button>
        <div class="flip-indicator-wrap">
          <div class="page-progress-text" id="pageProgressText">1 / 8</div>
          <div class="page-dots-row" id="pageDotsRow"></div>
        </div>
        <button class="flip-btn" id="nextPageBtn" title="หน้าถัดไป">›</button>
      </div>
    </section>

    <!-- 2. GRID CATALOG SECTION -->
    <section class="grid-section" id="gridSection">
      <div class="grid-products-container" id="gridContainer">
        <!-- Dynamically populated by app.js -->
      </div>
    </section>

    <!-- Bottom Action & LINE Status -->
    <footer class="bottom-floating-bar">
      <div class="bottom-shop-info">
        <div class="shop-line-pill" id="bottomLineIdPill" title="คลิกเพื่อแก้ไข LINE ID">
          <span>💬</span>
          <span>LINE: @daisyday</span>
        </div>
      </div>
      <button class="bottom-btn-direct-line" onclick="openLineDirect()">
        <span>💬 ทักแชท LINE ร้าน</span>
      </button>
    </footer>

  </div>

  <!-- ORDER / SEND TO LINE MODAL SHEET -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal-sheet">
      <div class="modal-handle-bar"></div>
      
      <div class="modal-header">
        <h3 class="modal-title">
          <img id="modalLogoMini" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" alt="Daisy Day" class="modal-logo-mini">
          <span>สั่งซื้อสินค้าผ่าน LINE</span>
        </h3>
        <button class="modal-close-btn" id="modalCloseBtn">✕</button>
      </div>

      <!-- Product Preview -->
      <div class="modal-product-summary">
        <img src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" alt="Preview" class="modal-product-img" id="modalProductImg">
        <div class="modal-product-details">
          <h4 id="modalProductTitle">Purple Lily</h4>
          <div class="sku" id="modalProductSku">รหัส: SB-001</div>
          <div class="price" id="modalProductPrice">79฿</div>
        </div>
      </div>

      <!-- Preview Message -->
      <div class="preview-message-box">
        <div class="preview-message-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#06c755"><path d="M24 10.3c0-5.18-5.38-9.4-12-9.4S0 5.12 0 10.3c0 4.64 4.27 8.52 10.05 9.24.39.08.93.26 1.06.6.12.31.08.8-.04 1.25l-.47 1.95c-.15.62-.7 2.45 2.15 1.34 2.84-1.11 7.68-4.52 10.48-7.75 1.84-2.12 2.77-4.27 2.77-6.63z"/></svg>
          <span>ข้อความที่จะส่งไปยังห้องแชท Daisy Day:</span>
        </div>
        <div class="preview-message-text" id="previewMessageText">
          สวัสดีค่ะ สนใจสั่งซื้อดอกไม้จากร้าน Daisy Day...
        </div>
      </div>

      <!-- Shop LINE ID Setting -->
      <div class="line-id-indicator">
        <div>
          <span>ห้องแชทร้าน: </span>
          <span class="line-id-val" id="currentLineIdText">@daisyday</span>
        </div>
        <span class="edit-line-id-link" id="editLineIdLink">✏️ แก้ไข LINE ID</span>
      </div>

      <!-- Modal Action Buttons -->
      <div class="modal-actions-col">
        <button class="btn-open-line-direct" id="btnOpenLineDirect">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#ffffff">
            <path d="M24 10.3c0-5.18-5.38-9.4-12-9.4S0 5.12 0 10.3c0 4.64 4.27 8.52 10.05 9.24.39.08.93.26 1.06.6.12.31.08.8-.04 1.25l-.47 1.95c-.15.62-.7 2.45 2.15 1.34 2.84-1.11 7.68-4.52 10.48-7.75 1.84-2.12 2.77-4.27 2.77-6.63z"/>
          </svg>
          <span>เปิดแชท LINE ทันที</span>
        </button>
        <button class="btn-copy-line-msg" id="btnCopyLineMsg">
          <span>📋 คัดลอกข้อความเพื่อส่งเอง</span>
        </button>
      </div>

    </div>
  </div>

  <!-- LIGHTBOX MODAL -->
  <div class="lightbox-overlay" id="lightbox">
    <img src="" alt="Enlarged Flower" id="lightboxImg">
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast-notice" id="toastNotice">
    <span>🌸</span>
    <span id="toastMessage">แจ้งเตือน</span>
  </div>

  <script src="./app.js"></script>
</body>
</html>
